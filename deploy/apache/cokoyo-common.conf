# :80 と :443 の両方から Include する共通部分。
#
# certbot --apache は :80 の vhost を丸ごとコピーして :443 を作るため、
# 片方だけ直すと必ずずれる。中身はここ1か所に置く。
#
#   /api/*        → コンテナ（127.0.0.1:8090 = compose の API_PORT）
#   /documents/*  → docs/
#   /explain/*    → 本番と同じ画面＋通信の中身（実データ。説明用）
#   /test/*       → 模擬バックエンドで動く版（偽のデータ。触って試す用）
#   /*            → 本番。実データに繋がる版

DocumentRoot /opt/cokoyo/frontend-v2/dist

# API。ProxyPass はファイルシステムへの割り当てより先に効くので、
# DocumentRoot 側の FallbackResource には吸われない。
ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:8090/api/
ProxyPassReverse /api/ http://127.0.0.1:8090/api/

# 設計ドキュメント（GitHub Pages からの引っ越し先）
Alias /documents /opt/cokoyo/docs
<Directory /opt/cokoyo/docs>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
    # 静的なHTMLなので、無い物は素直に404にする
    FallbackResource disabled
</Directory>

# 本番と同じ画面に、スマホ枠とバックエンドとのやりとりを添えたもの。データは本物。
Alias /explain /opt/cokoyo/frontend-v2/dist-explain
<Directory /opt/cokoyo/frontend-v2/dist-explain>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
    FallbackResource /explain/index.html
</Directory>

# 同じ画面を、接続先を渡さずにビルドしたもの。ブラウザの中の模擬バックエンドで動く。
# ここに出るフレンドと在校は本物ではない。
Alias /test /opt/cokoyo/frontend-v2/dist-test
<Directory /opt/cokoyo/frontend-v2/dist-test>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
    FallbackResource /test/index.html
</Directory>

# 以前 /preview で配っていたので、リンクが死なないよう飛ばす
RedirectMatch 302 ^/preview(/.*)?$ /test/

<Directory /opt/cokoyo/frontend-v2/dist>
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    # SPAのクライアントルーティング。
    # 招待リンクは /?add=<shareKey> なので、ここではなく / がそのまま受ける。
    FallbackResource /index.html
</Directory>
