# 元は certbot --apache が生成したもの。
# 中身が :80 と重複していたので、共通部分を Include に置き換えて git 管理に移した。
# 証明書の更新では、下の2行が指すファイルが差し替わるだけでこの vhost は書き換わらない。

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cokoyo.lazyta-toru.net

    Include /opt/cokoyo/deploy/apache/cokoyo-common.conf

    ErrorLog  ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_error.log
    CustomLog ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/cokoyo.lazyta-toru.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cokoyo.lazyta-toru.net/privkey.pem
</VirtualHost>
</IfModule>
