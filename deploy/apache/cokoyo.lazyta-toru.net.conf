# 既存の Apache に相乗りする vhost（HTTP）。中身は cokoyo-common.conf を見る。
#
#   cp deploy/apache/*.conf /etc/apache2/sites-available/
#   a2ensite cokoyo.lazyta-toru.net cokoyo.lazyta-toru.net-le-ssl
#   apache2ctl configtest && systemctl reload apache2
#
# 証明書は certbot --apache -d cokoyo.lazyta-toru.net で取得済み。
# 更新時に差し替わるのは証明書ファイルだけで、この vhost は書き換わらない。

<VirtualHost *:80>
    ServerName cokoyo.lazyta-toru.net

    Include /opt/cokoyo/deploy/apache/cokoyo-common.conf

    ErrorLog  ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_error.log
    CustomLog ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_access.log combined

    # certbot --redirect が足したもの。他のサイトと同じ形。
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =cokoyo.lazyta-toru.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
