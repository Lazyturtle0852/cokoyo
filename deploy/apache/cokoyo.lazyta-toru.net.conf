# 既存の Apache に相乗りする vhost。
#
#   /api/*        → コンテナ（127.0.0.1:8090 = compose の API_PORT）
#   /documents/*  → docs/*.html
#   /*            → フロントのビルド成果物
#
# フロントとAPIが同一オリジンになるので CORS は不要。
#
#   cp deploy/apache/cokoyo.lazyta-toru.net.conf /etc/apache2/sites-available/
#   a2ensite cokoyo.lazyta-toru.net
#   apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d cokoyo.lazyta-toru.net
#
# 443 側は certbot が -le-ssl.conf を作って管理する（他のサイトと同じ）。

<VirtualHost *:80>
    ServerName cokoyo.lazyta-toru.net

    DocumentRoot /opt/cokoyo/frontend

    # API。ProxyPass はファイルシステムへの割り当てより先に効くので、
    # DocumentRoot 側の FallbackResource には吸われない。
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8090/api/
    ProxyPassReverse /api/ http://127.0.0.1:8090/api/

    # 設計ドキュメント（GitHub Pages からの引っ越し先）
    Alias /documents /opt/cokoyo/docs
    <Directory /opt/cokoyo/docs>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
        # 静的なHTMLなので、無い物は素直に404にする
        FallbackResource disabled
    </Directory>

    <Directory /opt/cokoyo/frontend>
        Require all granted
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.html
        # SPAのクライアントルーティング
        FallbackResource /index.html
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_error.log
    CustomLog ${APACHE_LOG_DIR}/cokoyo.lazyta-toru.net_access.log combined
</VirtualHost>
