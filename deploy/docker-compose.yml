name: cokoyo

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # 0 で実APIを叩く。1 にするとMACから決定的に在校を組み立てるモックになる。
      MOCK_DTC: "0"
      DTC_BASE_URL: "https://api.dtc.wide.ad.jp"
      TIMING_FLOOR_MS: "250"
      REGISTER_RATE_LIMIT: "20"
    volumes:
      - api-data:/data
    # ローカルにだけ開ける。外から届く経路は手前のリバースプロキシだけにする。
    # ホスト側のポートは他のサービスとぶつかるので API_PORT で変えられるようにしてある。
    # 変えたら apache/ の vhost の ProxyPass も合わせること。
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"
    restart: unless-stopped

  # 80/443 が空いているホストに置く場合だけ使う:
  #   docker compose --profile caddy up -d
  # 既存の Apache / nginx が居るホストでは使わない（apache/ の vhost を参照）。
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - ../docs:/srv/documents:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  api-data:
