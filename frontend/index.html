<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COKOYO（仮）</title>
<style>
  :root { --ink:#16211d; --muted:#55655e; --line:#ccd8d2; --paper:#f4f7f5; --card:#fff;
          --me:#0d6f5e; --me-bg:#e3f2ee; --warn:#b03a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; background:var(--paper);
         color:var(--ink); line-height:1.5; padding:20px 16px 48px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:1.5rem; letter-spacing:-0.02em; }
  .tag { font-size:.72rem; font-weight:700; color:var(--warn); letter-spacing:.06em; }
  section { background:var(--card); border:1.5px solid var(--line); border-radius:14px;
            padding:16px; margin-top:14px; }
  h2 { font-size:.95rem; margin-bottom:8px; }
  p.note { font-size:.8rem; color:var(--muted); margin-bottom:10px; }
  input, button, select { font:inherit; }
  input, select { width:100%; padding:10px 12px; border:1.5px solid var(--line);
                  border-radius:9px; background:#fbfcfb; }
  button { min-height:44px; padding:10px 16px; border:none; border-radius:9px;
           background:var(--me); color:#fff; font-weight:700; cursor:pointer; }
  button.sub { background:#eef2f0; color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:8px; }
  /* flexアイテムは min-width:auto のままだと入力欄が縮まず横に溢れる */
  .row > * { min-width:0; }
  .row > input { flex:1; }
  .row > button { flex:0 0 auto; white-space:nowrap; }
  code { font-family:ui-monospace,monospace; font-size:.8rem; background:#f0f3f1;
         border:1px solid var(--line); border-radius:5px; padding:1px 5px; word-break:break-all; }
  .friend { border-top:1px solid #e6ece9; padding:11px 0; }
  .friend:first-of-type { border-top:none; }
  .friend .head { display:flex; align-items:center; gap:8px; }
  .friend .name { font-weight:700; flex:1; }
  .pill { font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:99px; }
  .pill.in { background:var(--me-bg); color:var(--me); }
  .pill.out { background:#f0f3f1; color:var(--muted); }
  .friend .ctl { display:flex; gap:8px; margin-top:7px; align-items:center; }
  .friend .ctl select { width:auto; padding:5px 9px; font-size:.78rem; }
  .friend .ctl button { min-height:32px; padding:5px 11px; font-size:.78rem; }
  .share { background:var(--me-bg); border:1.5px solid #9ed0c4; border-radius:10px;
           padding:10px 12px; margin-top:8px; }
  .msg { font-size:.8rem; color:var(--warn); margin-top:8px; min-height:1.2em; }
  .as-of { font-size:.74rem; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>COKOYO</h1>
  <div class="tag">仮フロント — 動作確認用。差し替え前提</div>

  <section id="register-section">
    <h2>登録</h2>
    <p class="note">
      設定アプリで <b>Wi-Fiアドレス</b> を確認して貼り付けてください。区切りの有無は問いません。
      MACをアプリが読む手段は iOS / Android ともに無いため、手入力です。
    </p>
    <div class="row">
      <input id="mac" placeholder="a2:b4:1c:9e:77:03" autocomplete="off" />
      <button id="register-btn">登録</button>
    </div>
    <div class="row"><input id="name" placeholder="表示名（共有文字列に載る）" autocomplete="off" /></div>
    <div class="msg" id="register-msg"></div>
  </section>

  <section id="me-section" hidden>
    <h2>自分</h2>
    <p class="note">この文字列を LINE などで友達に渡します。<code>secret</code> は渡しません。</p>
    <div class="share"><code id="share-string"></code></div>
    <div class="row">
      <button class="sub" id="copy-btn">コピー</button>
      <button class="sub" id="logout-btn">この端末から消す</button>
    </div>
  </section>

  <section id="friends-section" hidden>
    <h2>フレンド</h2>
    <div class="row">
      <input id="share-input" placeholder="cokoyo1:k_...:なまえ" autocomplete="off" />
      <button id="add-btn">追加</button>
    </div>
    <div class="msg" id="friends-msg"></div>
    <div id="friends"></div>
    <div class="row"><button id="presence-btn">今いる？</button></div>
    <div class="as-of" id="as-of"></div>
  </section>
</div>

<script type="module">
const API = "/api/v1";
const BUILDING_LABELS = {
  kappa:"κ館", epsilon:"ε館", iota:"ι館", omicron:"ο館", delta:"δ館", tau:"τ館",
  mu:"μ館", omega:"ω館", alpha:"α館", theta:"θ館", lambda:"λ館",
  "pe-buildings":"体育施設", sigma:"σ館", lounge:"ラウンジ",
};

const store = {
  get secret() { return localStorage.getItem("cokoyo.secret"); },
  set secret(v) { v ? localStorage.setItem("cokoyo.secret", v) : localStorage.removeItem("cokoyo.secret"); },
  get shareKey() { return localStorage.getItem("cokoyo.share_key"); },
  set shareKey(v) { v ? localStorage.setItem("cokoyo.share_key", v) : localStorage.removeItem("cokoyo.share_key"); },
  get name() { return localStorage.getItem("cokoyo.name") ?? ""; },
  set name(v) { localStorage.setItem("cokoyo.name", v); },
  // share_key → 表示名。バックエンドは名前を持たないので端末側で覚える。
  get names() { return JSON.parse(localStorage.getItem("cokoyo.names") ?? "{}"); },
  set names(v) { localStorage.setItem("cokoyo.names", JSON.stringify(v)); },
};

const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const headers = { "content-type": "application/json", ...(options.headers ?? {}) };
  if (store.secret) headers.authorization = `Bearer ${store.secret}`;
  const res = await fetch(API + path, { ...options, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error?.message ?? `HTTP ${res.status}`);
  return body;
}

function parseShare(input) {
  const t = input.trim();
  const a = t.indexOf(":");
  if (a === -1 || t.slice(0, a) !== "cokoyo1") return null;
  const b = t.indexOf(":", a + 1);
  if (b === -1) return null;
  const shareKey = t.slice(a + 1, b), name = t.slice(b + 1);
  return shareKey && name ? { shareKey, name } : null;
}

let connections = [];
let presence = {};

function render() {
  const signedIn = Boolean(store.secret);
  $("register-section").hidden = signedIn;
  $("me-section").hidden = !signedIn;
  $("friends-section").hidden = !signedIn;
  if (!signedIn) return;

  $("share-string").textContent = `cokoyo1:${store.shareKey}:${store.name || "なまえ"}`;

  const names = store.names;
  $("friends").innerHTML = "";
  for (const conn of connections) {
    const state = presence[conn.share_key];
    const label = state?.present
      ? (state.building ? BUILDING_LABELS[state.building] ?? state.building : "キャンパス")
      : "いない";

    const el = document.createElement("div");
    el.className = "friend";
    el.innerHTML = `
      <div class="head">
        <span class="name"></span>
        <span class="pill ${state?.present ? "in" : "out"}"></span>
      </div>
      <div class="ctl">
        <select>
          <option value="campus">キャンパスまで</option>
          <option value="building">建物まで</option>
        </select>
        <button class="sub"></button>
      </div>`;
    el.querySelector(".name").textContent = names[conn.share_key] ?? conn.share_key;
    el.querySelector(".pill").textContent = conn.blocked ? "ブロック中" : label;

    const select = el.querySelector("select");
    select.value = conn.scope;
    select.disabled = conn.blocked;
    select.onchange = () => patch(conn.share_key, { scope: select.value });

    const blockBtn = el.querySelector("button");
    blockBtn.textContent = conn.blocked ? "解除" : "ブロック";
    blockBtn.onclick = () => patch(conn.share_key, { blocked: !conn.blocked });

    $("friends").appendChild(el);
  }
}

async function refresh() {
  const me = await api("/me");
  store.shareKey = me.share_key;
  connections = me.connections;
  render();
}

async function patch(shareKey, body) {
  try {
    await api(`/connections/${shareKey}`, { method: "PATCH", body: JSON.stringify(body) });
    await refresh();
  } catch (err) { $("friends-msg").textContent = err.message; }
}

$("register-btn").onclick = async () => {
  $("register-msg").textContent = "";
  try {
    const mac = $("mac").value;
    const res = await api("/register", { method: "POST", body: JSON.stringify({ mac }) });
    store.secret = res.secret;
    store.shareKey = res.share_key;
    store.name = $("name").value.trim() || "なまえ";
    await refresh();
  } catch (err) { $("register-msg").textContent = err.message; }
};

$("copy-btn").onclick = () => navigator.clipboard.writeText($("share-string").textContent);

$("logout-btn").onclick = () => {
  if (!confirm("この端末から消します。同じMACで登録し直せば復帰できます。")) return;
  store.secret = null;
  location.reload();
};

$("add-btn").onclick = async () => {
  $("friends-msg").textContent = "";
  const parsed = parseShare($("share-input").value);
  if (!parsed) { $("friends-msg").textContent = "cokoyo1:... の形式で貼り付けてください"; return; }
  try {
    await api("/connections", { method: "POST", body: JSON.stringify({ share_key: parsed.shareKey }) });
    store.names = { ...store.names, [parsed.shareKey]: parsed.name };
    $("share-input").value = "";
    await refresh();
  } catch (err) { $("friends-msg").textContent = err.message; }
};

$("presence-btn").onclick = async () => {
  $("friends-msg").textContent = "";
  try {
    const keys = connections.map((c) => c.share_key);
    const res = await api("/presence", { method: "POST", body: JSON.stringify({ share_keys: keys }) });
    presence = Object.fromEntries(res.results.map((r) => [r.share_key, r]));
    $("as-of").textContent = `最終確認 ${new Date(res.as_of).toLocaleString("ja-JP")}`;
    render();
  } catch (err) { $("friends-msg").textContent = err.message; }
};

if (store.secret) refresh().catch(() => { store.secret = null; render(); });
else render();
</script>
</body>
</html>
